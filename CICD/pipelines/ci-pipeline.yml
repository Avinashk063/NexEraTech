trigger:
- master  

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self

# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

# Restore
- script: dotnet restore NexEraTech.Web/NexEraTech.Web.csproj
  displayName: 'Restore'

# Build
- script: dotnet build NexEraTech.Web/NexEraTech.Web.csproj --configuration Release --no-restore
  displayName: 'Build'

# FIXED PUBLISH
- script: |
    dotnet publish NexEraTech.Web/NexEraTech.Web.csproj \
      -c Release \
      -o $(Build.ArtifactStagingDirectory)
  displayName: 'Publish'

# Verify
- script: |
    echo "Published Output:"
    ls -la $(Build.ArtifactStagingDirectory)
  displayName: 'Verify Output'

# Publish artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact'
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'drop'
    publishLocation: 'Container'